workflows:
  ibo-admin-ios-testflight:
    name: IBO Admin iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Vibeset Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.ibocreative.admin
      vars:
        APP_DIR: mobile/ibo-admin-expo
        APP_STORE_APPLE_ID: 6792026724
        XCODE_WORKSPACE: ios/IBOAdmin.xcworkspace
        XCODE_SCHEME: IBOAdmin
        # Expo's precompiled XCFrameworks can be built against a newer ExpoModulesCore than the
        # one in package-lock and then crash at launch with missing symbols (build 1.2.0/8).
        EXPO_USE_PRECOMPILED_MODULES: "0"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          cd "$APP_DIR"
          npm ci
      - name: Generate native iOS project
        script: |
          cd "$APP_DIR"
          npx expo prebuild --platform ios --clean --no-install
          cd ios && pod install
      - name: Set up code signing
        script: |
          cd "$APP_DIR"
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd "$APP_DIR/ios"
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: Build ipa
        script: |
          cd "$APP_DIR"
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
      - name: Verify ExpoModulesCore symbols
        script: |
          # Fails the build when any binary in the app needs an ExpoModulesCore symbol that the
          # bundled ExpoModulesCore does not export; such builds crash before the first frame.
          set -euo pipefail
          WORK=$(mktemp -d)
          unzip -q "$APP_DIR"/build/ios/ipa/*.ipa -d "$WORK"
          APP=$(find "$WORK/Payload" -maxdepth 1 -name "*.app" | head -1)
          if grep -q "Expo-precompiled" -r "$APP_DIR/ios/Pods/Target Support Files" 2>/dev/null; then echo "Precompiled Expo modules were used"; fi
          CORE="$APP/Frameworks/ExpoModulesCore.framework/ExpoModulesCore"
          if [ -f "$CORE" ]; then
            nm -gU "$CORE" | awk '{print $NF}' | sort -u > "$WORK/defined.txt"
            : > "$WORK/missing.txt"
            find "$APP" -type f -perm +111 | while read -r BIN; do
              file "$BIN" | grep -q "Mach-O" || continue
              [ "$BIN" = "$CORE" ] && continue
              nm -u "$BIN" 2>/dev/null | awk '{print $NF}' | grep 's15ExpoModulesCore' | sort -u | comm -23 - "$WORK/defined.txt" | sed "s|^|$(basename "$BIN"): |" >> "$WORK/missing.txt" || true
            done
            if [ -s "$WORK/missing.txt" ]; then
              echo "Binaries reference ExpoModulesCore symbols that are not exported:"
              cat "$WORK/missing.txt"
              exit 1
            fi
            echo "All ExpoModulesCore symbol references resolve."
          else
            echo "ExpoModulesCore is linked statically; dynamic symbol check not applicable."
          fi
    artifacts:
      - mobile/ibo-admin-expo/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Diagnostics: builds Release for the simulator, launches it and collects crash logs.
  ibo-admin-ios-simulator-smoke:
    name: IBO Admin iOS → Simulator smoke test
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        APP_DIR: mobile/ibo-admin-expo
        BUNDLE_ID: de.ibocreative.admin
        SMOKE_REFS: "HEAD"
        EXPO_USE_PRECOMPILED_MODULES: "0"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build, launch and collect logs
        script: |
          set -x
          ROOT="$CM_BUILD_DIR"
          OUT="$ROOT/smoke"
          mkdir -p "$OUT"
          git fetch --unshallow || git fetch --all || true
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,l in d.items() if "iOS" in r for x in l if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          for REF in $SMOKE_REFS; do
            cd "$ROOT"
            git checkout -f "$REF" -- . 2>/dev/null || git checkout -f "$REF"
            SHA=$(git rev-parse --short HEAD)
            cd "$ROOT/$APP_DIR"
            npm ci > "$OUT/$REF-npm.log" 2>&1
            npx expo prebuild --platform ios --clean --no-install > "$OUT/$REF-prebuild.log" 2>&1
            (cd ios && pod install > "$OUT/$REF-pods.log" 2>&1)
            xcodebuild -workspace ios/IBOAdmin.xcworkspace -scheme IBOAdmin -configuration Release \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
              CODE_SIGNING_ALLOWED=NO build > "$OUT/$REF-xcodebuild.log" 2>&1 || { echo "BUILD FAILED $REF"; tail -40 "$OUT/$REF-xcodebuild.log"; continue; }
            APP=$(find build/sim/Build/Products -maxdepth 2 -name "*.app" | head -1)
            xcrun simctl uninstall "$UDID" "$BUNDLE_ID" || true
            rm -f ~/Library/Logs/DiagnosticReports/IBOAdmin* || true
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch "$UDID" "$BUNDLE_ID"
            sleep 25
            xcrun simctl io "$UDID" screenshot "$OUT/$REF-screen.png" || true
            echo "=== $REF ($SHA) running processes:"
            xcrun simctl spawn "$UDID" launchctl list | grep -i "$BUNDLE_ID" || echo "APP NOT RUNNING ($REF)"
            xcrun simctl spawn "$UDID" log show --last 3m --style compact \
              --predicate 'process == "IBOAdmin" AND (messageType == error OR messageType == fault OR eventMessage CONTAINS[c] "exception" OR eventMessage CONTAINS[c] "error")' \
              > "$OUT/$REF-device.log" 2>&1 || true
            echo "=== $REF device log (errors):"; tail -60 "$OUT/$REF-device.log"
            for f in ~/Library/Logs/DiagnosticReports/IBOAdmin*; do
              [ -f "$f" ] || continue
              cp "$f" "$OUT/"
              echo "=== CRASH REPORT $f"; head -120 "$f"
            done
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          done
    artifacts:
      - smoke/**
