workflows:
  ibo-admin-ios-testflight:
    name: IBO Admin iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: IBO App Store Connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.ibocreative.admin
      vars:
        APP_DIR: mobile/ibo-admin-expo
        APP_STORE_APPLE_ID: 6792026724
        XCODE_WORKSPACE: ios/IBOAdmin.xcworkspace
        XCODE_SCHEME: IBOAdmin
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          cd "$APP_DIR"
          npm ci
      - name: Generate native iOS project
        script: |
          cd "$APP_DIR"
          npx expo prebuild --platform ios --clean --no-install
          cd ios && pod install
      - name: Set up code signing
        script: |
          cd "$APP_DIR"
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd "$APP_DIR/ios"
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: Build ipa
        script: |
          cd "$APP_DIR"
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - mobile/ibo-admin-expo/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
